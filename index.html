<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatApp</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<style>
::-webkit-scrollbar {
    width: 8px;
}
::-webkit-scrollbar-thumb {
    background: #475569;
    border-radius: 10px;
}
</style>
</head>

<body class="bg-slate-950 text-white">

<!-- LOGIN SCREEN -->
<div id="loginScreen" class="min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl">

        <div class="text-center mb-8">

            <i data-lucide="message-circle"
               class="w-16 h-16 mx-auto text-blue-500"></i>

            <h1 class="text-4xl font-bold mt-4">
                ChatApp
            </h1>

            <p class="text-slate-400 mt-2">
                Browser Chat Demo
            </p>

        </div>

        <input
            id="usernameInput"
            type="text"
            placeholder="Enter username"
            class="w-full p-3 bg-slate-800 rounded-xl outline-none mb-4">

        <button
            onclick="login()"
            class="w-full bg-blue-600 hover:bg-blue-700 transition p-3 rounded-xl font-semibold">

            Login

        </button>

    </div>

</div>

<!-- APP -->
<div id="appScreen" class="hidden h-screen flex flex-col">

    <!-- TOPBAR -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 flex justify-between items-center">

        <div class="flex items-center gap-2">
            <i data-lucide="message-circle"></i>
            <span class="font-bold">ChatApp</span>
        </div>

        <div class="flex gap-2">

            <button
                onclick="toggleSettings()"
                class="p-2 hover:bg-slate-800 rounded-lg">

                <i data-lucide="settings"></i>

            </button>

            <button
                onclick="logout()"
                class="p-2 hover:bg-slate-800 rounded-lg">

                <i data-lucide="log-out"></i>

            </button>

        </div>

    </header>

    <!-- CHAT -->
    <div
        id="chatContainer"
        class="flex-1 overflow-y-auto p-4 space-y-3">
    </div>

    <!-- INPUT -->
    <div class="bg-slate-900 border-t border-slate-800 p-4 flex gap-2">

        <input
            id="messageInput"
            placeholder="Type a message..."
            class="flex-1 bg-slate-800 p-3 rounded-xl outline-none">

        <button
            onclick="sendMessage()"
            class="bg-blue-600 hover:bg-blue-700 px-5 rounded-xl">

            <i data-lucide="send"></i>

        </button>

    </div>

</div>

<!-- SETTINGS PANEL -->
<div
    id="settingsPanel"
    class="hidden fixed inset-0 bg-black/60 flex items-center justify-center p-4">

    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 w-full max-w-md">

        <h2 class="text-2xl font-bold mb-5">
            Settings
        </h2>

        <label class="block mb-2 text-slate-300">
            Change Username
        </label>

        <input
            id="newUsername"
            class="w-full p-3 bg-slate-800 rounded-xl mb-4">

        <button
            onclick="changeUsername()"
            class="w-full bg-blue-600 p-3 rounded-xl mb-3">

            Save Username

        </button>

        <button
            onclick="toggleTheme()"
            class="w-full bg-purple-600 p-3 rounded-xl mb-3">

            Toggle Theme

        </button>

        <button
            onclick="clearMessages()"
            class="w-full bg-red-600 p-3 rounded-xl mb-3">

            Clear Chat

        </button>

        <button
            onclick="toggleSettings()"
            class="w-full bg-slate-700 p-3 rounded-xl">

            Close

        </button>

    </div>

</div>

<script>

lucide.createIcons();

function login() {

    let username =
        document.getElementById("usernameInput").value.trim();

    if(!username) return;

    localStorage.setItem("username", username);

    showApp();
}

function logout() {

    localStorage.removeItem("username");

    location.reload();
}

function showApp() {

    document.getElementById("loginScreen")
        .classList.add("hidden");

    document.getElementById("appScreen")
        .classList.remove("hidden");

    loadMessages();
}

function sendMessage() {

    let input =
        document.getElementById("messageInput");

    let text = input.value.trim();

    if(!text) return;

    let messages =
        JSON.parse(localStorage.getItem("messages")) || [];

    messages.push({

        user: localStorage.getItem("username"),

        text: text,

        time: new Date().toLocaleTimeString()

    });

    localStorage.setItem(
        "messages",
        JSON.stringify(messages)
    );

    input.value = "";

    loadMessages();
}

function loadMessages() {

    let messages =
        JSON.parse(localStorage.getItem("messages")) || [];

    let html = "";

    messages.forEach(msg => {

        html += `
        <div class="bg-slate-800 p-4 rounded-2xl">

            <div class="flex justify-between mb-1">

                <span class="font-bold text-blue-400">
                    ${msg.user}
                </span>

                <span class="text-xs text-slate-400">
                    ${msg.time}
                </span>

            </div>

            <div>
                ${msg.text}
            </div>

        </div>
        `;
    });

    document.getElementById("chatContainer").innerHTML = html;

    let chat =
        document.getElementById("chatContainer");

    chat.scrollTop = chat.scrollHeight;
}

function toggleSettings() {

    document
      .getElementById("settingsPanel")
      .classList.toggle("hidden");
}

function changeUsername() {

    let newName =
        document.getElementById("newUsername").value;

    if(!newName) return;

    localStorage.setItem("username", newName);

    alert("Username updated!");
}

function clearMessages() {

    localStorage.removeItem("messages");

    loadMessages();
}

function toggleTheme() {

    document.body.classList.toggle("bg-white");
    document.body.classList.toggle("text-black");
}

if(localStorage.getItem("username")) {

    showApp();
}

</script>

</body>
</html>
